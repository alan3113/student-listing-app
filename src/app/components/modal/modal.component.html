<div class="modal-container">
  <h2 mat-dialog-title class="modal-title">Delete User</h2>
  <span class="modal-text">
    Would you like to delete user {{ data.user }}?
  </span>
  <mat-dialog-actions class="modal-actions">
    <button mat-button mat-dialog-close class="btn cancel-btn">No</button>
    <button mat-button mat-dialog-close class="btn confirm-btn cdkFocusInitial" (click)="onConfirm()">
      Delete
    </button>
  </mat-dialog-actions>
</div>
